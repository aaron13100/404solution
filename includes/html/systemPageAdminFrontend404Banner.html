<!-- allow-hardcoded-color: frontend 404 page banner shown to logged-in admins; admin theme CSS is not loaded on the frontend so inline literals are required -->
<div style="position:fixed;top:0;left:0;right:0;z-index:999999;background:#fff3cd;border-bottom:2px solid #ffc107;padding:12px 20px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;">{message} <a href="{settings_url}" style="color:#0073aa;text-decoration:underline;">{settings_label}</a></div>
