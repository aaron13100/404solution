<tr class="{rowClass}" id="post-{rowid}">
    <td>
        <input type="checkbox" name="idnum[]" value="{rowid}" onchange="enableDisableApplyButton();">
    </td>
    <td class="abj404-url-cell" title="{rowURL}">
        <a href="{visitorURL}" target="_blank" title="{Visit URL}">{rowURL}</a>
        <div class="abj404-row-actions">
            {editBtnHTML} | {logsBtnHTML} | {trashBtnHTML}{deleteBtnHTML}
        </div>
    </td>
    <td>
        <span class="abj404-badge {statusBadgeClass}" title="{statusTitle}">{status}</span>
    </td>
    <td>
        <span class="abj404-type-badge">{type}</span>
    </td>
    <td class="abj404-dest-cell" title="{dest}">
        <span style="{destination-exists}">
            <a {link} target="_blank" title="{title}" class="{dest_class}">{dest}</a>
        </span>
        <span class="abj404-dest-tooltip" style="{destination-does-not-exist}">
            <span class="abj404-tooltip-text">{This page doesn't exist or is not published so the redirect won't work.}</span>
            <a href="{link}" target="_blank" class="abj404-dest-warning">{dest}</a>
        </span>
    </td>
    <td>
        <span class="abj404-badge {codeBadgeClass}">{rowCode}</span>
    </td>
    <td class="abj404-hits-cell">{hits}</td>
    <td class="abj404-date-cell hide-on-tablet">{created_date}</td>
    <td class="abj404-date-cell {lastUsedClass}">{last_used_date}</td>
</tr>
