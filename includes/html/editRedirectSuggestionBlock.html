<div class="abj404-suggestion-block" id="abj404-suggestion-block">
<p class="abj404-suggestion-label"><strong>{suggestion_label}</strong></p>
<p class="abj404-suggestion-content"><strong>{suggestion_title}</strong>{suggestion_type_label}<span class="abj404-score-badge abj404-score-{suggestion_score_bucket}">{suggestion_score}% {match_text}</span></p>
<p class="abj404-suggestion-actions">
<button type="button" class="button button-primary" onclick="abj404AcceptSuggestion(this)" data-page-title="{suggestion_title_attr}" data-page-id-type="{suggestion_id_and_type}">{accept_label}</button>
<button type="button" class="button" onclick="abj404ShowManualPicker()">{pick_different_label}</button>
</p>
</div>
