<p>{description}</p>
<div class="abj404-diagnostic-data-actions">
    <button type="button" class="button abj404-diagnostic-data-download" data-nonce="{exportNonce}">{downloadLabel}</button>
    <button type="button" class="button abj404-diagnostic-data-delete" data-nonce="{deleteNonce}">{deleteLabel}</button>
</div>
<div class="abj404-diagnostic-data-notice" aria-live="polite"></div>
<p class="description abj404-diagnostic-data-empty-note" hidden>{emptyAfterDelete}</p>
<div class="abj404-modal abj404-diagnostic-data-modal" role="dialog" aria-modal="true" aria-labelledby="abj404-diagnostic-data-modal-title" hidden>
    <div class="abj404-modal-content">
        <div class="abj404-modal-header">
            <h2 id="abj404-diagnostic-data-modal-title">{modalTitle}</h2>
            <button type="button" class="abj404-modal-close abj404-diagnostic-data-cancel" aria-label="{cancelLabel}">&times;</button>
        </div>
        <div class="abj404-modal-body">
            <p>{modalBody}</p>
            <div class="abj404-diagnostic-data-modal-notice" aria-live="polite"></div>
        </div>
        <div class="abj404-modal-footer">
            <button type="button" class="button abj404-diagnostic-data-cancel">{cancelLabel}</button>
            <button type="button" class="button button-link-delete abj404-diagnostic-data-confirm">{confirmLabel}</button>
        </div>
    </div>
</div>
