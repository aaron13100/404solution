<p><strong>{setup_steps_label}</strong></p>
<ol class="abj404-wizard-steps">
<li>{step_create_project}</li>
<li>{step_enable_api}</li>
<li>{step_create_credentials}</li>
<li>{step_add_redirect_uri}<div class="abj404-copy-uri-wrap"><code id="abj404-gsc-callback-uri" class="abj404-gsc-callback-code">{callback_url}</code><button type="button" class="abj404-btn abj404-btn-secondary abj404-copy-btn" onclick="abj404CopyGscUri(this)">{copy_label}</button></div></li>
<li>{step_enter_credentials}</li>
</ol>
<script>function abj404CopyGscUri(btn){var code=document.getElementById('abj404-gsc-callback-uri');if(!code||!navigator.clipboard)return;navigator.clipboard.writeText(code.textContent.trim()).then(function(){var orig=btn.textContent;btn.textContent='{copied_label}';btn.classList.add('abj404-copy-btn--done');setTimeout(function(){btn.textContent=orig;btn.classList.remove('abj404-copy-btn--done');},2000);});}</script>
<form method="POST">{nonce_field}<input type="hidden" name="action" value="saveGscSettings">
<div class="abj404-form-group">
<label class="abj404-form-label" for="gsc_client_id">{client_id_label}</label>
<input type="text" name="gsc_client_id" id="gsc_client_id" class="abj404-form-input" value="{client_id_value}">
</div>
<div class="abj404-form-group">
<label class="abj404-form-label" for="gsc_client_secret">{client_secret_label}</label>
<input type="password" name="gsc_client_secret" id="gsc_client_secret" class="abj404-form-input" value="{client_secret_value}">
</div>
<div class="abj404-form-group">
<label class="abj404-form-label" for="gsc_site_url">{site_url_label}</label>
<input type="url" name="gsc_site_url" id="gsc_site_url" class="abj404-form-input" value="{site_url_value}">
<p class="abj404-form-help">{site_url_help}</p>
</div>
<button type="submit" class="abj404-btn abj404-btn-primary">{save_label}</button>
</form>
